[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-gui"
version = "1.0.0"
description = "A simple desktop to-do list (Tkinter)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
todo-gui = "todo_gui.app:main"

[tool.setuptools]
packages = ["todo_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
